# Duplication only. These bundles are built from sources that are analysed in their own right, and CI rebuilds
# each one and compares it byte for byte. Five of them inline the same checker, so they duplicate each other by
# construction, and that duplication is not code anyone writes or can remove. They are still analysed for bugs
# and vulnerabilities; only the duplicated-lines count skips them.
sonar.cpd.exclusions=\
  html/checker.js,\
  html/fixer.js,\
  html/assets/appwithai-wasm.js,\
  html/assets/appwithai-fullstack.js,\
  website/viewers/eml-model.js,\
  packages/generator/src/generators/wasm/runtime-assets.generated.ts,\
  packages/generator/src/generators/wasm/overlay-assets.generated.ts
