# Generated bundles and verbatim copies are built from sources that are already analysed.
# Three of them inline the same checker, so they duplicate each other by construction,
# and CI rebuilds each one and compares it byte for byte. Analysing them adds noise
# (and duplication) without finding anything in code a person writes.
sonar.exclusions=\
  html/checker.js,\
  html/fixer.js,\
  html/assets/appwithai-wasm.js,\
  html/assets/appwithai-fullstack.js,\
  html/wasm-app/sw.js,\
  website/viewers/eml-model.js,\
  packages/generator/src/generators/wasm/runtime-assets.generated.ts,\
  packages/generator/src/generators/wasm/overlay-assets.generated.ts
sonar.cpd.exclusions=\
  html/checker.js,\
  html/fixer.js,\
  html/assets/appwithai-wasm.js,\
  html/assets/appwithai-fullstack.js,\
  website/viewers/eml-model.js,\
  packages/generator/src/generators/wasm/runtime-assets.generated.ts,\
  packages/generator/src/generators/wasm/overlay-assets.generated.ts
